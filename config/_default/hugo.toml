# =====================================================================================
# It's recommended to use Alternate Theme Config to configure FixIt
# Modifying this file may result in merge conflict
# There are currently some restrictions to what a theme component can configure:
# params, menu(s), outputformats and mediatypes
# =====================================================================================

# -------------------------------------------------------------------------------------
# Hugo Configuration
# See: https://gohugo.io/configuration/all/
# -------------------------------------------------------------------------------------

# website title
title = "FlareBlog"
# Hostname (and path) to the root
baseURL = "https://www.jamesflare.com/"
# theme list
theme = ["FixIt", "component-projects"]
# determines default content language ["en", "zh-cn", "fr", "pl", ...]
defaultContentLanguage = "en"
# language code ["en", "zh-CN", "fr", "pl", ...]
locale = "en"
# whether to include Chinese/Japanese/Korean
hasCJKLanguage = true
# copyright description used only for seo schema
copyright = ""
# whether to use robots.txt
enableRobotsTXT = true
# whether to use git commit log
enableGitInfo = false
# whether to use emoji code
enableEmoji = true
# default amount of posts in each pages
[pagination]
  pagerSize = 12

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^USER$', '^HOME$']

# -------------------------------------------------------------------------------------
# Front Matter Configuration
# See: https://gohugo.io/configuration/front-matter/
# -------------------------------------------------------------------------------------

[frontmatter]
_merge = "shallow"
lastmod = [
  "lastmod",
  ":git",
  ":fileModTime",
  ":default",
]

# -------------------------------------------------------------------------------------
# Imaging Configuration
# See: https://gohugo.io/configuration/imaging/
# -------------------------------------------------------------------------------------

[imaging]
_merge = "shallow"
quality = 75

# -------------------------------------------------------------------------------------
# Related content Configuration
# See: https://gohugo.io/content-management/related-content/
# -------------------------------------------------------------------------------------

[related]
includeNewer = false
threshold = 80
toLower = false

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'keywords'
pattern = ''
toLower = false
type = 'basic'
weight = 100

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'date'
pattern = ''
toLower = false
type = 'basic'
weight = 10

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'tags'
pattern = ''
toLower = false
type = 'basic'
weight = 80

[[related.indices]]
applyFilter = false
name = 'fragmentrefs'
type = 'fragments'
weight = 80

# -------------------------------------------------------------------------------------
# Modules Configuration
# See: https://gohugo.io/configuration/module/
# -------------------------------------------------------------------------------------

[module]

[module.hugoVersion]
extended = true
min = "0.161.0"

# -------------------------------------------------------------------------------------
# Markup Configuration
# See: https://gohugo.io/configuration/markup/
# -------------------------------------------------------------------------------------

[markup]
_merge = "shallow"

# Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
[markup.highlight]
# ~~~~~~~~~~ necessary configurations ~~~~~~~~~~
# https://github.com/hugo-fixit/FixIt/issues/43
codeFences = true
noClasses = false
# ~~~~~~~~~~ necessary configurations ~~~~~~~~~~
anchorLineNos = false
guessSyntax = true
lineNos = true
lineNumbersInTable = true

# Goldmark is from Hugo 0.60 the default library used for Markdown
# See: https://gohugo.io/configuration/markup/#goldmark
[markup.goldmark]
duplicateResourceFiles = false

[markup.goldmark.extensions]
definitionList = true
footnote = true
linkify = true
linkifyProtocol = 'https'
strikethrough = false
table = true
taskList = true
typographer = true

# See: https://gohugo.io/configuration/markup/#extras
[markup.goldmark.extensions.extras]

[markup.goldmark.extensions.extras.delete]
enable = true

[markup.goldmark.extensions.extras.insert]
enable = true

[markup.goldmark.extensions.extras.mark]
enable = true

[markup.goldmark.extensions.extras.subscript]
enable = true

[markup.goldmark.extensions.extras.superscript]
enable = true

# https://gohugo.io/content-management/mathematics/
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [
  [
    '\[',
    '\]'
  ],
  [
    '$$',
    '$$'
  ]
]
inline = [
  [
    '\(',
    '\)'
  ],
  [
    '$',
    '$'
  ]
]

[markup.goldmark.parser]

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
hardWraps = false
# whether to use HTML tags directly in the document
unsafe = true
xhtml = false

# -------------------------------------------------------------------------------------
# Sitemap Configuration
# See: https://gohugo.io/templates/sitemap/#configuration
# -------------------------------------------------------------------------------------

[sitemap]
changefreq = "always"
disable = false
filename = "sitemap.xml"
priority = 0.5

# -------------------------------------------------------------------------------------
# Permalinks Configuration
# See: https://gohugo.io/content-management/urls/#permalinks
# -------------------------------------------------------------------------------------

[permalinks]
posts = ":slugorcontentbasename"

# -------------------------------------------------------------------------------------
# Privacy Configuration
# See: https://gohugo.io/configuration/privacy/
# -------------------------------------------------------------------------------------

[privacy]

[privacy.x]
enableDNT = true

[privacy.youtube]
privacyEnhanced = true

# -------------------------------------------------------------------------------------
# Media Types Configuration
# See: https://gohugo.io/configuration/media-types/
# -------------------------------------------------------------------------------------

[mediaTypes]
# Options to make output .md files
[mediaTypes."text/markdown"]
suffixes = ["md"]
# Options to make output .txt files
[mediaTypes."text/plain"]
suffixes = ["txt"]

# -------------------------------------------------------------------------------------
# Output Format Configuration
# See: https://gohugo.io/configuration/output-formats/
# -------------------------------------------------------------------------------------

[outputFormats]

# FixIt 0.3.0 | NEW Options to make output /archives/index.html file
[outputFormats.archives]
path = "archives"
baseName = "index"
mediaType = "text/html"
isPlainText = false
isHTML = true
permalinkable = true
notAlternative = true

# FixIt 0.3.0 | NEW Options to make output /offline/index.html file
[outputFormats.offline]
path = "offline"
baseName = "index"
mediaType = "text/html"
isPlainText = false
isHTML = true
permalinkable = true
notAlternative = true

# FixIt 0.3.0 | NEW Options to make output readme.md file
[outputFormats.readme]
baseName = "readme"
mediaType = "text/markdown"
isPlainText = true
isHTML = false
notAlternative = true

# FixIt 0.3.0 | CHANGED Options to make output baidu_urls.txt file
[outputFormats.baidu_urls]
baseName = "baidu_urls"
mediaType = "text/plain"
isPlainText = true
isHTML = false
notAlternative = true

# FixIt 0.3.10 | NEW Options to make output search.json file
[outputFormats.search]
baseName = "search"
mediaType = "application/json"
rel = "search"
isPlainText = true
isHTML = false
permalinkable = true

# -------------------------------------------------------------------------------------
# Output Configuration
# See: https://gohugo.io/configuration/outputs/
# -------------------------------------------------------------------------------------

# Options to make hugo output files, the optional values are below:
# home = ["html", "rss", "archives", "offline", "readme", "baidu_urls", "search"]
# page = ["html", "markdown"]
# section = ["html", "rss"]
# taxonomy = ["html"]
# term = ["html", "rss"]
[outputs]
_merge = "shallow"
home = [
  "html",
  "rss",
  "archives",
  "offline",
  "search"
]
page = [
  "html",
  "markdown"
]
section = [
  "html",
  "rss"
]
taxonomy = [ "html" ]
term = [
  "html",
  "rss"
]

# -------------------------------------------------------------------------------------
# Taxonomies Configuration
# See: https://gohugo.io/configuration/taxonomies/
# -------------------------------------------------------------------------------------

[taxonomies]
_merge = "shallow"
category = "categories"
tag = "tags"
collection = "collections"

# -------------------------------------------------------------------------------------
# Theme Core Configuration
# See: https://fixit.lruihao.cn/references/configuration/
# -------------------------------------------------------------------------------------

[params]
# FixIt 0.2.15 | CHANGED FixIt theme version
version = "1.0.0-alpha.3"
# site description
description = ""
# site keywords
keywords = []
# site default theme ["light", "dark", "auto"]
default_theme = "auto"
# which hash function used for SRI, when empty, no SRI is used
# ["sha256", "sha384", "sha512", "md5"]
fingerprint = ""
# date format
date_format = "2006-01-02"
# website images for Open Graph and Twitter Cards
images = []
# FixIt 0.3.13 | NEW whether to capitalize titles
capitalize_titles = true
# FixIt 0.3.0 | NEW whether to add site title to the title of every page
# remember to set up your site title in `hugo.toml` (e.g. title = "title")
with_site_title = true
# FixIt 0.3.0 | NEW title delimiter when the site title is be added to the title of every page
title_delimiter = "-"
# FixIt 0.3.0 | NEW whether to add site subtitle to the title of index page
# remember to set up your site subtitle by `params.header.subtitle.name`
index_with_subtitle = false
# FixIt 0.3.13 | NEW whether to show summary in plain text
summary_plainify = false
# FixIt 0.4.0 | NEW whether to enable merging missing translations from other languages
# when set to true, missing translations from other languages will be merged and displayed
# default is false for better performance, especially for single-language sites
# set to true if your site has multiple languages and you want to show all content
enable_translation_merge = false
# FixIt 0.2.14 | NEW FixIt will, by default, inject a theme meta tag in the HTML head on the home page only.
# You can turn it off, but we would really appreciate if you don’t, as this is a good way to watch FixIt's popularity on the rise.
disable_theme_inject = false

# Page defaults (individual pages may override these in front matter)
author_avatar = true
hidden_from_home_page = false
hidden_from_search = false
hidden_from_related = false
hidden_from_feed = false
twemoji = false
lightgallery = true
ruby = true
fraction = true
fontawesome = true
license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>'
page_style = "wide"
auto_bookmark = false
show_lastmod = true
word_count = true
reading_time = true
end_flag = ""
instant_page = true
collection_list = true
collection_navigation = true

# Author Configuration
[params.author]
name = "James"
email = ""
link = "https://jamesflare.com"
avatar = "/site-logo.avif"

# FixIt 0.3.0 | NEW public Git repository information only then enableGitInfo is true

[params.git_info]
# e.g. "https://github.com/hugo-fixit/docs"
repo = ""
branch = "main"
# the content directory path relative to the root of the repository
dir = "content"
# the issue template for reporting issue of the posts
# available template params: {title} {URL} {sourceURL}
issue_tpl = "title=[BUG]%20{title}&body=|Field|Value|%0A|-|-|%0A|Title|{title}|%0A|URL|{URL}|%0A|Filename|{sourceURL}|"

# App icon config

[params.app]
# optional site title override for the app when added to an iOS home screen or Android launcher
# whether to omit favicon resource links
no_favicon = false
# modern SVG favicon to use in place of older style .png and .ico files
svg_favicon = ""
# Safari mask icon color
# Windows v8-10 tile color
tile_color = "#da532c"

# FixIt 0.2.12 | CHANGED Android browser theme color
pwa = false
name = "FixIt"
mask_color = "#5bbad5"

[params.app.theme_color]
light = "#f8f8f8"
dark = "#252627"

# Search config

[params.search]
enable = true
# type of search engine ["algolia", "fuse", "cse", "post-chat"]
type = "fuse"
# max index length of the chunked content
content_length = 4000
# placeholder of the search bar
placeholder = ""
# max number of results length
max_result_length = 10
# snippet length of the result
snippet_length = 30
# HTML tag name of the highlight part in results
highlight_tag = "em"
# whether to use the absolute URL based on the baseURL in search index
absolute_url = false
# FixIt 0.4.0 | NEW whether to enable anchorify for headings in search results
anchorify = true

[params.search.algolia]
index = ""
app_id = ""
search_key = ""

# FixIt 0.2.17 | NEW https://fusejs.io/api/options.html

[params.search.fuse]
is_case_sensitive = false
min_match_char_length = 2
find_all_matches = false
location = 0
threshold = 0.3
distance = 100
ignore_location = false
use_extended_search = false
ignore_field_norm = false

# FixIt 0.3.16 | NEW Custom Search Engine (CSE)

[params.cse]
# Search Engine: ["google", "bing"]
engine = ""
# Search results page URL (layout: search)
results_page = "/search/"

# Google: https://programmablesearchengine.google.com/
# Google Custom Search Engine Context

[params.cse.google]
cx = ""

# Bing (Unsupported): https://www.customsearch.ai/

[params.cse.bing]

# Header config

[params.header]
# FixIt 0.2.13 | CHANGED desktop header mode ["sticky", "normal", "auto"]
desktop_mode = "sticky"
# FixIt 0.2.13 | CHANGED mobile header mode ["sticky", "normal", "auto"]
mobile_mode = "auto"

# Header title config

[params.header.title]
# URL of the LOGO
logo = ""
# title name
name = "FlareBlog"
# you can add extra information before the name (HTML format is supported), such as icons
pre = ""
# you can add extra information after the name (HTML format is supported), such as icons
post = ""
# whether to use typeit animation for title name
typeit = false

# FixIt 0.2.12 | NEW Header subtitle config

[params.header.subtitle]
# subtitle name
name = ""
# whether to use typeit animation for subtitle name
typeit = false

# FixIt 0.2.18 | NEW Breadcrumb config

[params.breadcrumb]
enable = false
sticky = false
show_home = false
# FixIt 0.3.13 | NEW
separator = "/"
capitalize = true

# FixIt 0.3.10 | NEW Post navigation config

[params.navigation]
# whether to show the post navigation in section pages scope
in_section = false
# whether to reverse the next/previous post navigation order
reverse = false

# Footer config

[params.footer]
enable = true
# whether to show copyright info
copyright = true
# whether to show the author
author = true
# Site creation year
since = ""
# FixIt 0.2.12 | NEW Public network security only in China (HTML format is supported)
gov = ""
