# Check for updates
c4u = false

# Page config

[params.post_link]
markdown = true
source = false
edit = false
report = true
editor = "vscode"

[params.link]
external_icon = false

[params.toc]
# whether to enable the table of the contents
enable = true
# whether to keep the static table of the contents in front of the post
keep_static = false
# whether to make the table of the contents in the sidebar automatically collapsed
auto = true
# position of TOC ["start", "end"]
position = "end"
# FixIt 0.3.12 | NEW supersede `markup.tableOfContents` settings
ordered = false
start_level = 2
end_level = 6
# FixIt 0.4.0 | NEW whether to decrease the H1 heading level in content
decrease_h1 = false

# FixIt 0.2.13 | NEW Display a message at the beginning of an article to warn the reader that its content might be expired

[params.expiration_reminder]
enable = true
# Display the reminder if the last modified time is more than 90 days ago
reminder = 90
# Display warning if the last modified time is more than 180 days ago
warning = 180
# If the article expires, close the comment or not
close_comment = false

# FixIt 0.3.0 | NEW page heading config

[params.heading]
# FixIt 0.3.3 | NEW whether to capitalize automatic text of headings
capitalize = false

# FixIt 0.3.12 | CHANGED must set `params.toc.ordered` to true

[params.heading.number]
# whether to enable auto heading numbering
enable = false
# FixIt 0.3.3 | NEW only enable in main section pages (default is posts)
only_main_section = true

[params.math]
enable = true
# mathematical formulas rendering engines, optional values: ["katex", "mathjax"]
type = "katex"

# KaTeX server-side rendering (https://katex.org)
# KaTeX partial config: https://gohugo.io/functions/transform/tomath/#options

[params.math.katex]
# KaTeX extension copy-tex
copy_tex = true
throw_on_error = false
error_color = "#ff4949"

# custom macros map
# syntax: <macro> = <definition>

[params.math.katex.macros]
# "\\f" = "#1f(#2)" # usage: $\f{a}{b}$

# MathJax server-side rendering (https://www.mathjax.org)
# MathJax config: https://docs.mathjax.org/en/latest/options/index.html

[params.math.mathjax]
cdn = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"

[params.math.mathjax.packages]
# "[+]" = ["configmacros"]

# custom macros map
# syntax: <macro> = <definition>

[params.math.mathjax.macros]
# bold = ["{\\bf #1}", 1] # usage: $\bold{math}$

[params.math.mathjax.loader]
load = [ "ui/safe" ]

[params.math.mathjax.loader.paths]
# custom = "https://cdn.jsdelivr.net/gh/sonoisa/XyJax-v3@3.0.1/build/"

# more loader config e.g source, dependencies, provides etc.

[params.math.mathjax.options]
enable_menu = true
# HTML tags that won't be searched for math
skip_html_tags = [
  "script",
  "noscript",
  "style",
  "textarea",
  "pre",
  "code",
  "math",
  "select",
  "option",
  "mjx-container"
]
# class that marks tags not to search
ignore_html_class = "mathjax_ignore"

# HTML tags that can appear within math

[params.math.mathjax.options.include_html_tags]
# "#comment" = ""
# br = "\n"
# wbr = ""

